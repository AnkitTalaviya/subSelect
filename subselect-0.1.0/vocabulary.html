<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubSelect vocabulary</title>
    <script type="module" crossorigin src="/assets/vocabulary.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/vocabulary.css">
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <div class="title">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>SubSelect Vocabulary</h1>
            <p class="count" id="count">Loading…</p>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="ghost" id="export-csv">Export CSV</button>
          <button type="button" class="ghost" id="export-json">Export JSON</button>
        </div>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search words, translations or context" aria-label="Search saved words" />
        <select id="sort" aria-label="Sort order">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="alphabetical">A → Z</option>
        </select>
      </div>

      <p class="empty" id="empty" hidden></p>
      <ul class="words" id="words"></ul>
    </main>

    <footer>
      <p>
        Saved words live only in this browser. Nothing here has been uploaded, and export
        files are generated on this device.
      </p>
    </footer>

  </body>
</html>
