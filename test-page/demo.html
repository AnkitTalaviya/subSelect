<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubSelect demo</title>
    <style>
      /*
       * A neutral player used to capture store screenshots.
       *
       * Deliberately generic: no real service is imitated, no third-party branding appears,
       * and the picture is generated here rather than being someone's footage. What the
       * screenshots show of SubSelect itself is the real extension running.
       */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #08090d;
        color: #eceef5;
        font: 15px/1.5 system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Full-bleed: this is what watching actually looks like, and it leaves no dead
         margin in a 1280x800 store screenshot. */
      .stage { width: 100vw; height: 100vh; }

      .player {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      .player video { width: 100%; height: 100%; display: block; object-fit: cover; }

      /* Caption layer, shaped the way commercial players shape theirs. */
      .player-captions {
        position: absolute;
        left: 6%;
        right: 6%;
        bottom: 11%;
        text-align: center;
        pointer-events: none;
      }
      .caption-line { display: block; }
      .caption-line > span {
        display: inline-block;
        padding: 0.08em 0.4em;
        background: rgba(6, 6, 8, 0.72);
        color: #fff;
        font-size: clamp(20px, 2.9vw, 38px);
        font-weight: 500;
        line-height: 1.34;
        border-radius: 3px;
      }

      /* Minimal chrome so it reads as a video player. */
      .chrome {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 68px;
        padding: 0 20px 14px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
      }
      .chrome .bar {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.28);
        position: relative;
      }
      .chrome .bar::before {
        content: '';
        position: absolute;
        inset: 0 62% 0 0;
        background: #fff;
        border-radius: 2px;
      }
      .chrome .time { font-size: 12px; color: rgba(255, 255, 255, 0.82); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="player" id="player">
        <video id="video" playsinline></video>
        <div class="player-captions" id="captions" role="region" aria-label="Untertitel" aria-live="polite"></div>
        <div class="chrome"><span class="time">18:42</span><span class="bar"></span><span class="time">41:07</span></div>
      </div>
    </div>

    <script>
      (function () {
        'use strict';
        const video = document.getElementById('video');
        const captions = document.getElementById('captions');

        /** A soft cinematic frame, so the caption sits on a real picture. */
        const canvas = document.createElement('canvas');
        canvas.width = 1280;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');

        let t = 0;
        function draw() {
          t += 0.0016;
          const w = canvas.width;
          const h = canvas.height;

          const sky = ctx.createLinearGradient(0, 0, 0, h);
          sky.addColorStop(0, '#14213d');
          sky.addColorStop(0.45, '#3b2a55');
          sky.addColorStop(1, '#8a4a52');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, h);

          // Drifting light, so the frame is clearly moving video.
          for (let i = 0; i < 3; i++) {
            const x = w * (0.25 + 0.3 * i) + Math.sin(t + i) * 60;
            const y = h * (0.3 + 0.12 * i);
            const glow = ctx.createRadialGradient(x, y, 0, x, y, 340);
            glow.addColorStop(0, `rgba(255, ${170 + i * 20}, 140, ${0.16 - i * 0.03})`);
            glow.addColorStop(1, 'rgba(255,170,140,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);
          }

          // Horizon and silhouette.
          ctx.fillStyle = 'rgba(10, 10, 18, 0.92)';
          ctx.beginPath();
          ctx.moveTo(0, h * 0.74);
          for (let x = 0; x <= w; x += 20) {
            ctx.lineTo(x, h * 0.74 + Math.sin(x / 190 + t * 2) * 14 + Math.sin(x / 70) * 5);
          }
          ctx.lineTo(w, h);
          ctx.lineTo(0, h);
          ctx.closePath();
          ctx.fill();

          // Vignette.
          const vignette = ctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.95);
          vignette.addColorStop(0, 'rgba(0,0,0,0)');
          vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, w, h);

          requestAnimationFrame(draw);
        }
        draw();

        video.srcObject = canvas.captureStream(30);
        video.play().catch(() => {});

        function setCaption(text) {
          captions.replaceChildren(
            ...String(text).split('\n').map((line) => {
              const outer = document.createElement('div');
              outer.className = 'caption-line';
              const inner = document.createElement('span');
              inner.textContent = line;
              outer.appendChild(inner);
              return outer;
            }),
          );
        }

        setCaption('Ich habe mich gestern für einen neuen Job entschieden.');
        window.__demo = { setCaption };
      })();
    </script>
  </body>
</html>
